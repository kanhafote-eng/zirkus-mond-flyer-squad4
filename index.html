<style>
:root{--night:#071a2c;--deep:#0b263d;--cream:#fff5d9;--ink:#102a3b;--gold:#f6bd4e;--coral:#ff806d;--mint:#9de0c4;--muted:#526879;--line:#decf9f;--pixel:ui-monospace,"Courier New",monospace;--body:"Trebuchet MS",Verdana,sans-serif}*{box-sizing:border-box}html{background:var(--night);scroll-behavior:smooth}body{margin:0;min-height:100vh;padding:0 0 calc(86px + env(safe-area-inset-bottom));color:#f4f0dc;font:16px/1.5 var(--body);background:radial-gradient(ellipse at 50% -20%,#315c73 0%,#102e47 38%,#071a2c 88%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:radial-gradient(#fff5d9 1px,transparent 1px);background-size:47px 47px;mask-image:linear-gradient(#000,transparent 85%)}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #ffe28a!important;outline-offset:3px}#app{position:relative;z-index:1;max-width:760px;margin:auto;min-height:100vh;padding-bottom:25px}.topbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 15px;background:#071a2cf2;border-bottom:1px solid #e6b85377;backdrop-filter:blur(8px)}.brand{display:flex;align-items:center;gap:9px;color:var(--gold);font:700 12px/1.4 var(--pixel);letter-spacing:.2px}.brand svg{width:42px;height:42px;flex:none}.brand small{display:block;color:#d7e0dd;font:12px var(--body);letter-spacing:1px}.sync-pill{border:1px solid #f6bd4e88;border-radius:20px;padding:5px 9px;color:#ffe3a0;font-size:12px;font-weight:800;white-space:nowrap}.sync-pill:before{content:"";display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%;background:var(--mint)}.sync-pill.offline:before{background:var(--coral)}.view{padding:15px;animation:rise .22s ease-out}@keyframes rise{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}.card{background:var(--cream);color:var(--ink);border:1px solid #dfc98f;border-radius:16px;box-shadow:0 6px 0 #030d17;padding:18px;margin:0 0 15px}.eyebrow{color:#176c55;font:700 10px/1.7 var(--pixel);letter-spacing:1px;text-transform:uppercase}h1,h2,h3{font-family:var(--pixel);line-height:1.5;color:#0b385b}h1{font-size:clamp(19px,5vw,27px);margin:8px 0 12px}h2{font-size:15px;margin:18px 0 9px}h3{font-size:12px;margin:4px 0}.lede{font-size:18px;line-height:1.45;color:#173d55}.small{font-size:13px;line-height:1.5;color:var(--muted)}.button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:9px 13px;margin:4px 3px 4px 0;border:2px solid #31546c;border-radius:10px;background:#123e5d;color:#fff8e9;font-weight:800;text-align:center;text-decoration:none;box-shadow:0 3px 0 #092036}.button:hover{background:#1b5679}.button.primary{background:#f4bf54;color:#132e41;border-color:#dca93f;box-shadow:0 3px 0 #9a6515}.button.light{background:#fff5d9;color:#16374f;border-color:#d6be7f}.button.quiet{background:#e5ebdf;color:#123b56;border-color:#b9c8b4;box-shadow:0 2px 0 #a4b09f}.button.small{font-size:13px;min-height:38px;padding:6px 9px}.field{display:block;margin:12px 0;color:#144563;font-weight:700}.field input,.field select,.field textarea{display:block;width:100%;min-height:46px;padding:10px 12px;margin-top:5px;border:1px solid #82979e;border-radius:9px;background:#fffdf7;color:#122e40;font-size:16px}.field textarea{min-height:82px}.actions{display:flex;flex-wrap:wrap;gap:5px}.route-hero{position:relative;overflow:hidden;padding:19px;background:linear-gradient(130deg,#143e5d,#0d2c45 67%,#274a57);border:1px solid #efc14f;border-radius:16px;box-shadow:0 6px 0 #030d17;margin:0 0 14px}.route-hero:after{content:"✦";position:absolute;right:14px;top:3px;color:#f6bd4e44;font-size:82px}.route-hero h1{color:#ffe28a;font-size:clamp(22px,6vw,32px);margin:4px 0}.route-hero p{margin:5px 0;color:#eef0df}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.stat{padding:12px;border-radius:11px;background:#e8eddf}.stat span,.stat b{display:block}.stat span{font-size:12px;color:#526879}.stat b{margin-top:5px;color:#104664;font:700 16px var(--pixel)}.place-card{display:grid;grid-template-columns:42px 1fr auto;align-items:start;gap:9px;padding:13px 0;border-bottom:1px solid #d6c9a6}.place-card:last-child{border-bottom:0}.place-icon{font-size:26px;text-align:center}.place-info{min-width:0}.place-info h3{margin:0;font-size:12px}.place-info p{margin:3px 0;font-size:13px;overflow-wrap:anywhere}.status{display:inline-block;padding:3px 7px;border-radius:15px;font-size:11px;font-weight:800;white-space:nowrap}.status.needs{background:#ffebc4;color:#684800}.status.done{background:#d6eddf;color:#14513d}.status.pending{background:#f8d8d2;color:#782b31}.material{padding:9px 11px;margin:7px 0 0;background:#f1ead5;border-radius:8px;font-size:13px;color:#344d5a}.thumbs{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.thumbs img{width:70px;height:70px;object-fit:cover;border-radius:8px;border:2px solid #d4bd7f}.log-item{border-bottom:1px solid #d6c9a6;padding:12px 0}.log-item:last-child{border:0}.log-head{display:flex;justify-content:space-between;gap:8px}.empty{padding:18px 12px;text-align:center;color:#526879;background:#f4edda;border-radius:11px}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(6,1fr);max-width:760px;margin:auto;padding:5px 4px calc(5px + env(safe-area-inset-bottom));background:#061726f5;border-top:2px solid var(--gold);box-shadow:0 -5px 20px #001321aa;backdrop-filter:blur(8px)}.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:57px;border:0;border-radius:8px;background:transparent;color:#e9e4d4;font-size:11px}.nav button b{font-size:19px;line-height:1}.nav button.active{background:#f3c55f;color:#102b41}.toast{position:fixed;z-index:50;left:50%;bottom:calc(83px + env(safe-area-inset-bottom));transform:translate(-50%,12px);opacity:0;pointer-events:none;max-width:calc(100vw - 32px);padding:11px 15px;border:1px solid #efbf4c;border-radius:12px;background:#fff0c6;color:#17374a;font-weight:800;box-shadow:0 5px 18px #0005;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.divider{border:0;border-top:1px solid #d6c9a6;margin:16px 0}.hint{padding:11px 12px;border-left:4px solid #177556;background:#e6f0e5;color:#164732;font-size:13px}.hide{display:none!important}.checkline{display:flex;align-items:center;gap:9px}.checkline input{width:20px;height:20px}.danger{color:#812c34}@media(min-width:600px){.view{padding:22px}.stats{grid-template-columns:repeat(2,1fr)}.card{padding:22px}}
.map-frame{height:430px;min-height:330px;border:2px solid #d6be7f;border-radius:12px;overflow:hidden;background:#e7e1cf;z-index:0}.mini-map{height:250px;min-height:220px}.map-legend{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.map-legend span{font-size:12px;color:#344d5a}.map-dot{width:18px;height:18px;border:2px solid #fff8e9;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 1px 4px #132b44aa}.leaflet-popup-content{font:14px/1.45 "Trebuchet MS",Verdana,sans-serif;color:#102a3b}.leaflet-popup-content h3{font-size:13px;margin:0 0 4px}.leaflet-popup-content p{margin:3px 0}.leaflet-container a.button{color:#fff8e9}.leaflet-container a.button.primary{color:#132e41}.leaflet-container a.button.light{color:#16374f}.leaflet-control-attribution{font-size:10px!important}.bulk-box{min-height:150px;font-family:var(--pixel)!important;font-size:13px!important}.import-report{padding:10px 12px;margin:10px 0;border-radius:9px;background:#e6f0e5;color:#164732;font-size:13px}@media(max-width:420px){.nav button{font-size:10px}.map-frame{height:380px}}
.map-pin{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #fff5d9;box-shadow:0 2px 6px #0008;font-size:17px;line-height:1}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}.result-grid label{position:relative;display:block}.result-grid input{position:absolute;opacity:0}.result-grid span{display:block;padding:14px 8px;text-align:center;border:2px solid var(--line);border-radius:14px;background:#fff8e6;color:var(--ink);font-weight:700}.result-grid input:checked+span{background:var(--gold);border-color:var(--gold)}.sync-pill{cursor:pointer}.maplink{color:inherit;text-decoration:underline dotted;text-underline-offset:3px}.logbox{border:2px dashed var(--line);border-radius:16px;padding:12px;margin:0 0 14px}.popup-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.leaflet-popup-content .small{margin:4px 0}</style>

<body><div id="app"><header class="topbar"><div class="brand"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3a20 20 0 1 0 20 28A17 17 0 0 1 24 3Z" fill="#f6bd4e"/><path d="m35 8 1.4 4 4.1 1.2-4.1 1.3-1.4 4-1.3-4-4.1-1.3 4.1-1.2Z" fill="#fff5d9"/><circle cx="12" cy="10" r="1.5" fill="#fff5d9"/><circle cx="13" cy="35" r="1.4" fill="#fff5d9"/></svg><span>ZIRKUS MOND<small>FLYER SQUAD</small></span></div><div class="sync-pill" id="syncBadge">Local ready</div></header><main id="screen" class="view"></main><nav class="nav" aria-label="Main navigation"><button data-tab="home"><b>☾</b>Route</button><button data-tab="places"><b>✦</b>Places</button><button data-tab="map"><b>⌖</b>Map</button><button data-tab="add"><b>＋</b>Add</button><button data-tab="history"><b>▤</b>History</button><button data-tab="settings"><b>⚙</b>Settings</button></nav></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
'use strict';const APP_VERSION='2.0.3';const resultGridHtml=n=>`<div class="result-grid">${Object.entries(RESULT_LABEL).map(([k,l],i)=>`<label><input type="radio" name="${n}" value="${k}" ${i?'':'checked'}><span>${l}</span></label>`).join('')}</div>`;const RESULT_LABEL={left:'✅ Left material',closed:'🔒 Closed',declined:'✋ Declined',comeback:'↩ Come back'};const REVISIT_DAYS={left:7,closed:1,comeback:2,declined:21};const lastQty=()=>{try{return JSON.parse(localStorage.getItem('zmLast'))||{}}catch{return {}}};
// Setup: deploy Code.gs as a Google Apps Script web app, then enter its /exec URL and shared token in Settings. Everything also works locally/offline; queued changes sync when a connection returns.
const STORE='zirkusMondFlyerSquadV1';
const TYPES={'Bar / café':'☕','Restaurant':'🍽️','Shop':'🏪','Club / nightlife':'🪩','Music venue':'🎸','Theatre / culture':'🎭','Cinema':'🎬','Gallery / museum':'🖼️','Bookshop':'📚','Library / community center':'🏠','University':'🎓','Sports / gym':'🏋️','Hostel / hotel':'🛎️','Other':'📍'};
const TYPE_ALIAS={'cafe':'Bar / café','bar':'Bar / café','restaurante':'Restaurant','tienda':'Shop','corner shop spati':'Shop','spati':'Shop','teatro cultura':'Theatre / culture','cultural space':'Theatre / culture','cine':'Cinema','galeria museo':'Gallery / museum','libreria':'Bookshop','biblioteca centro vecinal':'Library / community center','community center':'Library / community center','universidad':'University','deporte gimnasio':'Sports / gym','hostel':'Hostel / hotel','hotel':'Hostel / hotel','otro':'Other','club':'Club / nightlife','discoteca':'Club / nightlife'};
function canonType(t){const k=normKey(t);return Object.keys(TYPES).find(x=>normKey(x)===k)||TYPE_ALIAS[k]||'Other'}
const icon=t=>TYPES[canonType(t)];
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>({worker:'',url:'',token:'',places:[],visits:[],queue:[]});let state;try{state={...blank(),...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{state=blank()}let tab='home',query='',workerPos=null;
function save(){localStorage.setItem(STORE,JSON.stringify(state));updateBadge()}
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2600)}
function updateBadge(){const b=$('syncBadge');if(!b)return;const off=!navigator.onLine,n=state.queue.length,t=+localStorage.getItem('zmLastSync')||0,hm=t?new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';b.textContent=off?`Offline · ${n?n+' saved':'ready'}`:window.syncErr&&n?'Sync error · tap to retry':n?`${n} waiting · tap to retry`:state.url?`Synced${hm?' · '+hm:''}`:'Local ready';b.title='Version '+APP_VERSION;b.classList.toggle('offline',off||n>0)}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function dateAgo(d){if(!d)return null;let x=new Date(d),now=new Date();return Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate())-new Date(x.getFullYear(),x.getMonth(),x.getDate()))/86400000)}
function lastVisit(id){return state.visits.filter(v=>String(v.placeId)===String(id)).sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]}
const revisitDays=id=>REVISIT_DAYS[lastVisit(id)?.result||'left']??7;
function ageStatus(p){const v=lastVisit(p.id),days=v?dateAgo(v.date):null;if(v&&v.date===today())return{label:'Visited today',cls:'done'};if(days===null)return{label:'Needs first visit',cls:'needs'};if(days>=revisitDays(p.id))return{label:`Needs revisit · ${days}d`,cls:'needs'};return{label:`Visited ${days} day${days===1?'':'s'} ago`,cls:'done'}}
function visitedToday(id){return state.visits.some(v=>String(v.placeId)===String(id)&&v.date===today())}
function distanceKm(p){if(!workerPos||!Number.isFinite(+p.lat)||!Number.isFinite(+p.lng))return null;const rad=n=>n*Math.PI/180;const a=rad(+p.lat-workerPos.lat),b=rad(+p.lng-workerPos.lng);const h=Math.sin(a/2)**2+Math.cos(rad(workerPos.lat))*Math.cos(rad(+p.lat))*Math.sin(b/2)**2;return 6371*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}
function sortedRoute(){return state.places.filter(p=>p.active!==false&&!visitedToday(p.id)&&(dateAgo(lastVisit(p.id)?.date)??9999)>=revisitDays(p.id)).sort((a,b)=>{const da=distanceKm(a),db=distanceKm(b);if(da!==null&&db!==null)return da-db;if(da!==null)return -1;if(db!==null)return 1;const aa=lastVisit(a.id),bb=lastVisit(b.id);return (dateAgo(bb?.date)??9999)-(dateAgo(aa?.date)??9999)||String(a.name).localeCompare(String(b.name))})}
function mediaHtml(v){let urls=[];if(v.dataUrl)urls.push(v.dataUrl);if(v._localPhoto&&!urls.includes(v._localPhoto))urls.push(v._localPhoto);if(v.photoUrl&&!urls.includes(v.photoUrl))urls.push(v.photoUrl);return urls.length?`<div class="thumbs">${urls.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="Delivery photo ${i+1}" loading="lazy"></a>`).join('')}</div>`:''}
const mapsUrl=p=>{const c=placeCoords(p);return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c?c.join(','):[p.name,p.address,p.city,p.country].filter(Boolean).join(', '))};
const addrLink=p=>{const t=[p.address,p.city,p.country].filter(Boolean).join(', ');return t?`<a class="maplink" target="_blank" rel="noopener" title="Open in Google Maps" href="${mapsUrl(p)}">📍 ${esc(t)} ↗</a>`:'Address not recorded'};
function placeCard(p,route=false){const st=ageStatus(p),d=distanceKm(p),v=lastVisit(p.id);return `<article class="place-card"><div class="place-icon">${icon(p.type)}</div><div class="place-info"><h3>${esc(p.name)}</h3><p>${addrLink(p)}</p><span class="status ${visitedToday(p.id)?'done':st.cls}">${visitedToday(p.id)?'✓ Done today':st.label}</span>${d!==null?` <span class="small">· ${d.toFixed(1)} km</span>`:''}<div class="material">📦 ${esc(p.deliveryPoint||'Drop-off spot not noted')}</div><div class="actions"><button class="button small light" data-detail="${esc(p.id)}">Details</button>${route?`<button class="button small primary" data-log="${esc(p.id)}">Log delivery</button>`:''}</div></div>${v&&visitedToday(p.id)?'<span aria-label="done today">✓</span>':''}</article>`}
function renderOnboarding(){ $('screen').innerHTML=`<section class="card"><div class="eyebrow">Welcome to the circus crew</div><h1>Let's get your route rolling</h1><p class="lede">A name, the crew's script link and shared token are all you need to join the flyer squad.</p><form id="settingsForm"><label class="field">Your name<input name="worker" required value="${esc(state.worker)}" placeholder="Flyer captain" autocomplete="name"></label><label class="field">Apps Script web app URL<input name="url" type="url" value="${esc(state.url)}" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off"></label><label class="field">Shared token<input name="token" value="${esc(state.token)}" placeholder="Shared crew password" autocomplete="off"></label><p class="hint">The token works like a shared password authorizing this app to talk to your crew's Google script. Ask your coordinator for the URL and token. You can also fill these in later in Settings.</p><button class="button primary" type="submit">Join the flyer squad ✦</button><button class="button light" type="button" id="localStart">Explore offline first</button></form></section>`;const local=$('localStart');local.addEventListener('click',()=>{state.worker=state.worker||'Flyer captain';save();go('home')})}
function renderHome(){const route=sortedRoute(),week=state.visits.filter(v=>dateAgo(v.date)>=0&&dateAgo(v.date)<7),visitedWeek=new Set(week.map(v=>String(v.placeId)));$('screen').innerHTML=`<section class="route-hero"><div class="eyebrow" style="color:#a9e2c7">Today's route · ${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</div><h1>Ready to spread some moonlight?</h1><p>${state.worker?`Welcome back, ${esc(state.worker)}! `:'Your crew is ready. '}${route.length?`${route.length} ${route.length===1?'place':'places'} could use a visit.`:'Every place is checked off for today — lovely work!'}</p><button class="button primary" id="locateBtn">◎ Sort by my location</button></section><section class="card"><div class="stats"><div class="stat"><span>Flyers this week</span><b>${week.reduce((n,v)=>n+(+v.flyers||0),0)}</b></div><div class="stat"><span>Places visited · 7 days</span><b>${visitedWeek.size}</b></div></div><div class="eyebrow">A good next stop</div>${route.length?route.slice(0,3).map(p=>placeCard(p,true)).join(''):'<div class="empty">No overdue stops right now. Add a new place or enjoy a well-earned breather. 🌙</div>'}${route.length>3?`<p class="small">+ ${route.length-3} more on your route. See all in Places.</p>`:''}<button class="button light" data-goto="places">See all places →</button>${state.places.some(p=>visitedToday(p.id))?`<hr class="divider"><div class="eyebrow">✓ Checked off today</div>${state.places.filter(p=>visitedToday(p.id)).map(p=>`<div class="place-card"><div class="place-icon">${icon(p.type)}</div><div class="place-info"><h3>${esc(p.name)}</h3><p>${esc(p.city||p.address||'')}</p><span class="status done">✓ Done today</span></div></div>`).join('')}`:''}</section><section class="card"><h2>Quick delivery log</h2><p class="small">Finished a drop? Record it now, even without a signal.</p><button class="button primary" data-goto="add">＋ Add a place</button><button class="button" id="quickLog">▤ Log a delivery</button></section>`}
function renderPlaces(){const arr=state.places.filter(p=>p.active!==false&&(!query||`${p.name} ${p.address} ${p.city} ${p.type}`.toLowerCase().includes(query.toLowerCase())));$('screen').innerHTML=`<section class="card"><div class="eyebrow">Your neighborhood constellation</div><h1>Places</h1><label class="field">Find a place<input id="searchPlaces" placeholder="Name, street, type…" value="${esc(query)}"></label><p class="small">${arr.length} place${arr.length===1?'':'s'} · Entries visited today are marked ✓</p>${arr.length?arr.map(p=>placeCard(p)).join(''):'<div class="empty">No places yet. Tap Add to start your first route. ✨</div>'}<button class="button primary" data-goto="add">＋ Add a place</button><button class="button light" data-goto="bulk">✦ Bulk import</button><button class="button light" data-goto="map">⌖ Map view</button></section>`}

function initMap(id,places,mini=false){const el=$(id);if(!el)return;if(!window.L){el.innerHTML='<div class="empty">The map library could not load. Check your connection and reload.</div>';return}const map=L.map(el,{scrollWheelZoom:!mini,tap:true}).setView([52.52,13.405],11);el.addEventListener('click',e=>{const b=e.target.closest('.leaflet-popup button');if(!b)return;if(b.dataset.log)renderLogForm(b.dataset.log);else if(b.dataset.detail)detail(b.dataset.detail)},true);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);if(mini){const lat=Number(el.closest('form')?.elements.lat.value),lng=Number(el.closest('form')?.elements.lng.value);if(Number.isFinite(lat)&&Number.isFinite(lng)&&el.closest('form').elements.lat.value!==''&&el.closest('form').elements.lng.value!=='')map.setView([lat,lng],15);map.on('click',ev=>{const form=el.closest('form');if(form){form.elements.lat.value=ev.latlng.lat.toFixed(6);form.elements.lng.value=ev.latlng.lng.toFixed(6);if(window.placePin)window.placePin.setLatLng(ev.latlng);else window.placePin=L.marker(ev.latlng,{icon:pinIcon('other')}).addTo(map);const status=$('geocodeStatus');if(status)status.textContent='Coordinates selected from the map.'}})}else{const bounds=[];places.forEach(place=>{const coords=placeCoords(place);if(!coords)return;bounds.push(coords);const addr=[place.address,place.city,place.country].filter(Boolean).join(', ');const destination=encodeURIComponent(coords.join(','));const directions=`https://www.google.com/maps/dir/?api=1&destination=${destination}`;const popup=`<h3>${esc(place.name||'Place')}</h3><p>${icon(place.type)} ${esc(canonType(place.type))}</p><p>${esc(addr||'Address not recorded')}</p><p class="small">${visitedToday(place.id)?'✓ Done today':ageStatus(place).label}</p><div class="popup-actions"><button class="button small primary" data-log="${esc(place.id)}">Log delivery</button><button class="button small light" data-detail="${esc(place.id)}">Details</button><a class="button small light" target="_blank" rel="noopener" href="${directions}">Directions ↗</a></div>`;L.marker(coords,{icon:pinIcon(place.type)}).addTo(map).bindPopup(popup)});if(bounds.length===1)map.setView(bounds[0],15);else if(bounds.length>1)map.fitBounds(bounds,{padding:[24,24],maxZoom:15});else{$('mapHint').textContent='No coordinates yet. Add coordinates using Locate on map or manual latitude/longitude fields.'}}setTimeout(()=>map.invalidateSize(),120);return map}

function renderBulk(){$('screen').innerHTML=`<section class="card"><div class="eyebrow">Bring the whole troupe along</div><h1>Bulk import</h1><p class="small">Paste rows copied from Excel or Google Sheets, or upload an .xlsx / .csv file. With a header row (name, type, address, city, contact, deliveryPoint, maxPosterSize, notes, lat, lng) columns are detected in any order. Without a header the order is: Name | Type | Address | City | Contact | Drop-off spot.</p><form id="bulkForm"><label class="field">File<input type="file" id="bulkFile" accept=".xlsx,.xls,.csv,.tsv,.txt"></label><label class="field">Places<textarea class="bulk-box" name="bulkLines" required></textarea></label><button class="button primary" type="submit">Review import</button></form><div id="bulkResult" aria-live="polite"></div><hr class="divider"><button class="button light" id="geoMissing">⌖ Locate places missing coordinates</button></section>`}
async function geocodeAddress(queryText){const url='https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(queryText);const response=await fetch(url,{headers:{'Accept-Language':'en'}});if(!response.ok)throw new Error('Address lookup failed. You can enter coordinates manually.');const hits=await response.json();return hits&&hits.length?{lat:+hits[0].lat,lng:+hits[0].lon}:null}

const normKey=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const pk=p=>normKey(p.name)+'|'+normKey(p.address);

const num=v=>{const n=parseFloat(String(v||'').replace(',','.'));return Number.isFinite(n)?n:''};
function parseTable(t,d){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"'&&!c)q=true;else if(ch==d){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))rows.push(r);r=[]}else c+=ch}r.push(c);if(r.some(x=>x.trim()))rows.push(r);return rows.map(x=>x.map(y=>y.trim()))}
function buildBulk(rows){const h=rows[0].map(x=>SYN[normKey(x)]);let map=['name','type','address','city','contact','deliveryPoint'];if(h.includes('name')&&h.filter(Boolean).length>=2){map=h;rows=rows.slice(1)}const seen=new Set(state.places.map(pk)),ok=[],dup=[],bad=[];rows.forEach((r,i)=>{const o={};map.forEach((k,j)=>{if(k&&!o[k])o[k]=r[j]||''});if(!o.name||!o.address){bad.push(i+1);return}if(seen.has(pk(o))){dup.push(o.name);return}seen.add(pk(o));ok.push({action:'addPlace',id:newId('place'),name:o.name,type:canonType(o.type),address:o.address,city:o.city||'Berlin',country:'Germany',contact:o.contact||'',deliveryPoint:o.deliveryPoint||'',maxPosterSize:o.maxPosterSize||'',notes:o.notes||'',lat:num(o.lat),lng:num(o.lng),addedBy:state.worker||'Crew',createdOn:new Date().toISOString(),active:true})});return{ok,dup,bad}}
function previewBulk(text){const t=text.trim();if(!t)return;const d=t.includes('\t')?'\t':t.includes('|')?'|':((t.match(/;/g)||[]).length>(t.match(/,/g)||[]).length?';':',');const res=buildBulk(parseTable(t,d));window.bulkPending=res.ok;const list=res.ok.slice(0,8).map(p=>`<li>${icon(p.type)} ${esc(p.name)} — ${esc(p.address)}</li>`).join('')+(res.ok.length>8?`<li>… and ${res.ok.length-8} more</li>`:'');$('bulkResult').innerHTML=`<div class="import-report"><b>${res.ok.length}</b> ready · ${res.dup.length} duplicate${res.dup.length===1?'':'s'} skipped · ${res.bad.length} row${res.bad.length===1?'':'s'} missing name or address${res.ok.length?`<ul class="small">${list}</ul><label class="checkline"><input type="checkbox" id="bulkGeo" checked> Find map locations after importing</label><button class="button primary" id="bulkConfirm">✦ Import ${res.ok.length} places</button>`:''}</div>`}

async function confirmBulk(){const items=window.bulkPending||[],out=$('bulkResult'),geo=$('bulkGeo')?.checked;let n=0;for(let i=0;i<items.length;i+=500){const chunk=items.slice(i,i+500),payload={action:'bulkImport',places:chunk};try{mergePosted(payload,await callApi(payload))}catch(e){if(!isNet(e)){save();out.innerHTML=`<div class="import-report">${esc(e.message)}. Imported so far: ${n}.</div>`;return}state.queue.push(payload);mergePosted(payload,{})}n+=chunk.length}save();window.bulkPending=[];out.innerHTML=`<div class="import-report">✓ ${n} places imported${state.queue.length?' (waiting to sync)':''}.</div>`;if(geo)geocodeMissing()}
async function geoThrottled(q){const w=1100-(Date.now()-(geoThrottled.t||0));if(w>0)await new Promise(r=>setTimeout(r,w));try{return await geocodeAddress(q)}finally{geoThrottled.t=Date.now()}}
async function geocodePlace(p){const c=[p.city,p.country].filter(Boolean).join(', '),a=String(p.address||'').replace(/(\d+)\s*[–-]\s*\d+/,'$1');for(const q of [...new Set([`${p.address}, ${c}`,`${a}, ${c}`,`${p.name}, ${p.city||''}`])]){try{const h=await geoThrottled(q);if(h)return h}catch{}}return null}
async function geocodeMissing(auto){if(geoRunning)return;geoRunning=true;if(auto!==true)geoFailed.clear();const todo=state.places.filter(p=>p.active!==false&&!placeCoords(p)&&!geoFailed.has(String(p.id)));let n=0;for(const p of todo){window.geoMsg=`Locating places… ${n}/${todo.length}`;const gs=$('geoStatus'),br=$('bulkResult');if(gs)gs.textContent=window.geoMsg;else if(br)br.innerHTML=`<div class="import-report">${window.geoMsg}</div>`;const hit=await geocodePlace(p);if(hit){const item={action:'addPlace',...p,lat:hit.lat,lng:hit.lng};delete item._localPhoto;try{mergePosted(item,await callApi(item))}catch(e){mergePosted(item,{});if(isNet(e))state.queue.push(item)}}else geoFailed.add(String(p.id));n++;save()}geoRunning=false;window.geoMsg='';if(tab==='map')renderMap();else{const br=$('bulkResult');if(br)br.innerHTML=`<div class="import-report">✓ ${state.places.filter(placeCoords).length} of ${state.places.length} places are on the map. <button class="button small light" data-goto="map">Open map</button></div>`}}

function dataURL(file){return new Promise((resolve,reject)=>{if(!file||!file.size)return resolve('');const img=new Image(),reader=new FileReader();reader.onerror=()=>reject(reader.error);reader.onload=()=>{img.onerror=()=>reject(new Error('Could not read image'));img.onload=()=>{const max=1000,scale=Math.min(1,max/img.width),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.7))};img.src=reader.result};reader.readAsDataURL(file)})}
async function callApi(item){const base=state.url.trim();if(!base||!state.token.trim())throw new Error('Add your Apps Script URL and token in Settings first.');const sep=base.includes('?')?'&':'?';const response=await fetch(`${base}${sep}token=${encodeURIComponent(state.token)}`,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(item)});if(!response.ok)throw new Error(`Server replied ${response.status}`);const data=await response.json();if(!data.ok)throw new Error(data.error||'Server rejected the change');return data}

function mergePosted(item,result){if(item.action==='bulkImport'){(item.places||[]).forEach(p=>mergePosted(p,{}));return}const {action,dataUrl:photo,...row}=item;if(action==='addPlace'){let p={...row,photoUrl:result.photoUrl||row.photoUrl||'',_localPhoto:photo||''};const i=state.places.findIndex(x=>String(x.id)===String(p.id));if(i<0)state.places.unshift(p);else state.places[i]={...state.places[i],...p}}else{let v={...row,photoUrl:result.photoUrl||row.photoUrl||'',_localPhoto:photo||''};const i=state.visits.findIndex(x=>String(x.id)===String(v.id));if(i<0)state.visits.unshift(v);else state.visits[i]={...state.visits[i],...v}}}
async function flushQueue(){if(!navigator.onLine||!state.queue.length)return;let rest=[];for(const item of state.queue){try{const result=await callApi(item);mergePosted(item,result)}catch(e){window.syncErr=e.message;rest.push(item)}}state.queue=rest;save();if(!rest.length){await syncPull();toast('All caught up with the moon crew ✨')}else toast(`${rest.length} change${rest.length===1?'':'s'} still waiting`)}
function mergeRows(existing,incoming){const map=new Map(existing.map(x=>[String(x.id),x]));for(const row of incoming||[]){if(!row.id)continue;const old=map.get(String(row.id))||{},r={...row};['lat','lng'].forEach(k=>{if((r[k]===''||r[k]==null)&&old[k]!==''&&old[k]!=null)delete r[k]});map.set(String(row.id),{...old,...r})}return [...map.values()]}
async function syncPull(){if(!state.url||!state.token||!navigator.onLine)return;const sep=state.url.includes('?')?'&':'?';try{const r=await fetch(`${state.url}${sep}token=${encodeURIComponent(state.token)}`);if(!r.ok)throw new Error('Network response');const payload=await r.json();if(!payload.ok)throw new Error(payload.error||'Could not sync');state.places=mergeRows(state.places,payload.places);state.visits=mergeRows(state.visits,payload.visits);save();window.syncErr='';localStorage.setItem('zmLastSync',String(Date.now()));updateBadge()}catch(e){window.syncErr=e.message;updateBadge();console.warn('Sync pull:',e.message)}}
async function syncAll(){if(!state.url||!state.token){toast('Add the web app URL and token in Settings first.');return}if(!navigator.onLine){toast('You are offline. Changes are safe on this device.');return}await flushQueue();await syncPull();go(tab)}
function newId(prefix){return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2,8)}`}
$('screen').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.goto){go(b.dataset.goto);return}if(b.dataset.detail){detail(b.dataset.detail);return}if(b.dataset.log){renderLogForm(b.dataset.log);return}if(b.id==='geocodeBtn'){const f=$('placeForm'),q=[f.elements.address.value,f.elements.city.value,f.elements.country.value].filter(Boolean).join(', '),status=$('geocodeStatus');if(!f.elements.address.value.trim()){toast('Enter an address first.');return}b.disabled=true;b.textContent='Looking up…';try{const hit=await geocodeAddress(q);if(!hit){status.textContent='No match found. Try a fuller address or tap the map.';toast('No location found')}else{f.elements.lat.value=hit.lat.toFixed(6);f.elements.lng.value=hit.lng.toFixed(6);const map=window.miniMap;if(map){map.setView([hit.lat,hit.lng],16);if(window.placePin)window.placePin.setLatLng([hit.lat,hit.lng]);else window.placePin=L.marker([hit.lat,hit.lng],{icon:pinIcon('other')}).addTo(map)}status.textContent='Location found. Adjust by tapping the map if needed.';toast('Location found ✦')}}catch(err){status.textContent=err.message;toast(err.message)}finally{b.disabled=false;b.textContent='⌖ Locate on map'}return}if(b.id==='locateBtn'){if(!navigator.geolocation){toast('Location is not available in this browser.');return}b.disabled=true;b.textContent='Finding your location…';navigator.geolocation.getCurrentPosition(pos=>{workerPos={lat:pos.coords.latitude,lng:pos.coords.longitude};renderHome();toast('Nearest places are now first')},()=>{toast('Could not get location. Showing overdue places first.');b.disabled=false;b.textContent='◎ Sort by my location'},{enableHighAccuracy:false,timeout:8000});return}if(b.id==='quickLog'){renderLogForm();return}});
document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab)});
$('screen').addEventListener('input',e=>{if(e.target.id==='searchPlaces'){query=e.target.value;const at=e.target.selectionStart;renderPlaces();const n=$('searchPlaces');n.focus();n.setSelectionRange(at,at)}});
$('screen').addEventListener('submit',async e=>{e.preventDefault();const f=e.target,fd=new FormData(f);if(f.id==='bulkForm'){previewBulk(f.elements.bulkLines.value);return}if(f.id==='settingsForm'){state.worker=String(fd.get('worker')||'').trim();state.url=String(fd.get('url')||'').trim();state.token=String(fd.get('token')||'').trim();save();toast('Crew settings saved');renderSettings();if(navigator.onLine)syncAll();return}const submit=f.querySelector('[type=submit]');submit.disabled=true;submit.textContent='Saving…';try{const photo=await dataURL(fd.get('photo'));if(f.id==='placeForm'){const id=newId('place'),row={action:'addPlace',id,name:String(fd.get('name')).trim(),type:String(fd.get('type')),address:String(fd.get('address')).trim(),city:String(fd.get('city')||'').trim(),country:String(fd.get('country')||'Germany').trim(),lat:fd.get('lat')?+fd.get('lat'):'',lng:fd.get('lng')?+fd.get('lng'):'',contact:String(fd.get('contact')||'').trim(),deliveryPoint:String(fd.get('deliveryPoint')||'').trim(),maxPosterSize:String(fd.get('maxPosterSize')||'').trim(),notes:String(fd.get('notes')||'').trim(),addedBy:state.worker||'Crew',createdOn:new Date().toISOString(),active:true,dataUrl:fd.get('logNow')?'':photo};const logNow=!!fd.get('logNow'),r=String(fd.get('v_result')||'left'),ok=r==='left',q=k=>ok?+fd.get('v_'+k)||0:0;if(logNow&&ok&&!q('flyers')&&!q('posters')&&!q('stickers'))throw new Error('Add at least one flyer, poster or sticker, or pick another result.');await submitItem(row);if(logNow){await submitItem({action:'logVisit',id:newId('visit'),placeId:id,placeName:row.name,date:today(),worker:state.worker||'Crew',result:r,flyers:q('flyers'),posters:q('posters'),stickers:q('stickers'),spokeWithSomeone:'',where:String(fd.get('v_where')||'').trim(),notes:'',dataUrl:photo});if(ok)localStorage.setItem('zmLast',JSON.stringify({flyers:q('flyers'),posters:q('posters'),stickers:q('stickers')}))}go(logNow?'history':'places')}else if(f.id==='visitForm'){const place=state.places.find(p=>String(p.id)===String(fd.get('placeId')));if(!place)throw new Error('Choose a place first');const row={action:'logVisit',id:newId('visit'),placeId:place.id,placeName:place.name,date:today(),worker:state.worker||'Crew',result:String(fd.get('result')||'left'),flyers:(fd.get('result')||'left')==='left'?+fd.get('flyers')||0:0,posters:(fd.get('result')||'left')==='left'?+fd.get('posters')||0:0,stickers:(fd.get('result')||'left')==='left'?+fd.get('stickers')||0:0,spokeWithSomeone:String(fd.get('spokeWithSomeone')||''),where:String(fd.get('where')||'').trim(),notes:String(fd.get('notes')||'').trim(),dataUrl:photo};await submitItem(row);if(row.result==='left')localStorage.setItem('zmLast',JSON.stringify({flyers:row.flyers,posters:row.posters,stickers:row.stickers}));go('history')}}catch(err){toast(err.message||'Could not save')}finally{if(submit){submit.disabled=false;submit.textContent=f.id==='placeForm'?'✦ Save place':'✓ Save delivery'}}});
$('screen').addEventListener('click',e=>{if(e.target.id==='syncNow')syncAll()});window.addEventListener('online',()=>{updateBadge();flushQueue()});window.addEventListener('offline',updateBadge);
updateBadge();if(!state.worker&&!state.url&&!state.token)renderOnboarding();else go('home');if(state.url&&state.token&&navigator.onLine){flushQueue().then(syncPull)}

const isNet=e=>!navigator.onLine||e instanceof TypeError||/failed|network|load|Add your Apps Script/i.test(e.message||'');
$('screen').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='bulkConfirm'){b.disabled=true;confirmBulk()}if(b.id==='geoMissing'){b.disabled=true;geocodeMissing().finally(()=>b.disabled=false)}});
$('screen').addEventListener('change',async e=>{if(e.target.id!=='bulkFile'||!e.target.files[0])return;const f=e.target.files[0];let t;if(/\.xlsx?$/i.test(f.name)){if(!window.XLSX)await new Promise(res=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=res;sc.onerror=res;document.head.appendChild(sc)});if(!window.XLSX){toast('Offline: could not load the Excel reader.');return}const wb=XLSX.read(await f.arrayBuffer());t=XLSX.utils.sheet_to_csv(wb.Sheets[['Places','Lugares'].find(n=>wb.Sheets[n])||wb.SheetNames[0]],{FS:'\t'})}else t=await f.text();document.querySelector('[name=bulkLines]').value=t;previewBulk(t)});
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));$('syncBadge').addEventListener('click',()=>syncAll());
$('screen').addEventListener('change',e=>{if(e.target.name==='logNow')$('logNowFields').style.display=e.target.checked?'':'none'});
